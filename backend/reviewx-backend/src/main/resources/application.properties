spring.application.name=reviewx-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/reviewx_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring AI 2.1.0 - Google Gemini Configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash
spring.ai.google.genai.chat.temperature=0.2

#To create bean for gemini code analyzer
reviewx.analyzer.provider=gemini

# GitHub REST API Configuration (Milestone 3)
reviewx.github.api-url=https://api.github.com
reviewx.github.token=${GITHUB_TOKEN:}